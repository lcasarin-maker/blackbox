# Hooks propios de este repo que el sync canonico debe PRESERVAR (DGX-244).
#
# Van AQUI y no en `.pre-commit-config.yaml`, que es GENERADO: `satellite_sync` lo
# reescribe entero ante cualquier diferencia. El dry-run del 2026-09-08 lo anuncio
# explicitamente para este repo: "REMOVES_UNKNOWN_HOOKS (bash-sintaxis)".
#
# `bash-sintaxis` existe porque este repo es bash puro, no Python: ruff y pyright
# no ven `bin/bb`, que es el 100% del codigo ejecutable. Sin este hook el arsenal
# canonico entero no comprueba ni una linea de lo unico que aqui se ejecuta.
# Verificado que BLOQUEA: con un `if [ roto` al final de bin/bb, el hook falla.
# `bb-cobertura-piso` existe porque `coverage-target` instrumenta Python y este
# repo es bash: el trinquete canonico pasaba sin haber mirado una sola linea de
# `bin/bb`. Un gate con cero capturas posibles es un defecto del instrumento, no
# evidencia de que el sujeto este limpio. Medido el 2026-09-24: 146 de 829
# lineas, 17.6%. Control negativo corrido, no argumentado: suite vacia -> 0.0%,
# tres tests -> 4.3%, los dieciocho -> 17.6%. El medidor puede salir negativo.
# `inventario` existe porque SPEC.md tenia dos tablas escritas a mano y una de
# ellas ya mentia: declaraba "Out of scope: actuar sobre lo que mide", mientras
# bb-usable reiniciaba la maquina y bb cap ponia techos. Una tabla que nadie
# comprueba describe lo que alguien recordaba. Este gate la ata al sujeto --
# bin/bb, tools/, adopted/ -- y cazo 6 desajustes en su primera corrida, de los
# cuales 2 eran defectos del propio instrumento y quedaron arreglados.
extra_hooks: |2
        - id: bash-sintaxis
          name: sintaxis de los scripts bash
          entry: >-
            python .simplecode/run.py simplecode.verification.gate_runner
            --root . --name bash-sintaxis --hook pre-commit --
            bash -n
          language: system
          files: '^(bin/bb|.*\.sh)$'
        - id: bb-cobertura-piso
          name: cobertura de bin/bb no baja del piso
          entry: >-
            python .simplecode/run.py simplecode.verification.gate_runner
            --root . --name bb-cobertura-piso --hook pre-push --
            tools/piso_cobertura.sh
          language: system
          stages: [pre-push]
          pass_filenames: false
          always_run: true
        - id: inventario-spec
          name: SPEC.md inventaria lo que el repo ejecuta y posee
          entry: >-
            python .simplecode/run.py simplecode.verification.gate_runner
            --root . --name inventario-spec --hook pre-commit --
            python3 -m tools.inventario --check
          language: system
          pass_filenames: false
          always_run: true
