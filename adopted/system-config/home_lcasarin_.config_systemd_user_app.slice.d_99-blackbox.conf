# blackbox: techo de memoria del slice donde viven las apps de escritorio,
# incluidas las sesiones de agente.
#
# POR QUE, con la medicion delante. Esta maquina se congelo TRES veces
# (2026-09-22 x2, 2026-09-24) y las tres con la misma firma: %system 99.4-99.7,
# %user 0.13, swap al 100 %, ldavg > 100, y entre 38 y 47 GB de RAM LIBRES --
# nunca fue agotamiento de RAM. El tercero lo grabaron las muestras de bin/bb
# con granularidad de minuto:
#
#   00:00:02  PSI full  0.0   mem disp 60.8 GB  load  4.8   2 procesos con GPU
#   00:01:03  PSI full  0.08  mem disp 47.5 GB  load 12.8   4 procesos con GPU
#   00:02:03  PSI full 19.28  mem disp  3.8 GB  load 24.9  23 procesos con GPU
#
# Los 22 nuevos estaban todos en `app-com.anthropic.Claude-<pid>.scope` y
# sumaban 68.5 GB de memoria unificada. Ese scope tenia
# MemoryMax=MemoryHigh=MemorySwapMax=infinity: nada lo limitaba.
#
# POR QUE AQUI Y NO EN EL SCOPE. El scope es transitorio y lleva el pid en el
# nombre (`...Claude-130715.scope`), asi que no admite un drop-in estable.
# `app.slice` es su padre y si.
#
# POR QUE UN CGROUP Y NO EL CONTADOR QUE YA HAY.
# simplecode.utils.unified_memory_slots cuenta y frena, pero es ADVISORY por
# construccion -- su propio docstring lo declara-- y solo lo invocan dos sitios
# de simplecode. Lo que tiro la maquina el 2026-09-24 fueron `python -m pytest`
# lanzados a mano, que no pasan por el. Un techo de cgroup lo aplica el kernel
# y no depende de que nadie llame a nada.
#
# EL NUMERO, y su limite. MemoryPeak de app.slice en la ventana observada:
# 22.3 GiB, con 21.9 GiB de uso corriente. 48 GiB es 2.2x lo observado sano y
# queda muy por debajo de los 68.5 GB del desbocamiento, asi que separa los dos
# casos medidos. LIMITE DECLARADO: esa observacion son ~1 h desde el ultimo
# arranque, no dias. Es un techo generoso elegido para no matar nada sano
# mientras se acumula historia, no un valor afinado. Revisar con
# `systemctl --user show app.slice -p MemoryPeak` cuando haya semanas de datos.
#
# QUE PASA AL TOCARLO: el kernel mata DENTRO de este slice, no en toda la caja.
# Es la leccion H35 (un OOM real mato el IDE del usuario y forzo un reset)
# aplicada al sitio que faltaba; el mismo patron que kb-nightly-investigator ya
# usa con MemoryMax=24G. Puede llevarse la propia app a media faena: ese es el
# precio, y es preferible a cinco horas de maquina inservible.
# --- TECHO DE SWAP, segunda medida -------------------------------------
# El techo de arriba limita cuanta RAM toma este slice. Esto limita cuanto del
# swap puede monopolizar, que es el mecanismo que se midio de verdad: el
# 2026-09-24 el swap paso de 100 % LIBRE a las 23:55:36 a 100 % USADO a las
# 00:24 y se quedo ahi las cinco horas. Con el swap agotado, cualquier
# asignacion que necesite reclaim se estanca -- de ahi el %system 99.5 con 38
# GB de RAM libres.
#
# NO se pone a 0. Prohibir el swap entero a las apps de escritorio las mataria
# en situaciones normales donde paginar memoria ociosa es lo correcto. 4G de
# los 16G del dispositivo acota la parte que este slice puede llevarse y deja
# 12G para el resto del sistema, que es justo lo que no quedo aquella noche.
#
# LIMITE DECLARADO: los 4G son una reparticion razonada, no medida. No hay
# historico de cuanto swap usa este slice en operacion sana porque
# MemorySwapPeak marcaba 0 hasta hoy. Revisar con
# `systemctl --user show app.slice -p MemorySwapPeak` cuando haya datos.
# --- ALCANCE REAL, medido el 2026-09-24 ---------------------------------
# QUE QUEDA DENTRO. Verificado leyendo /proc/<pid>/cgroup: un proceso lanzado
# por una sesion de agente cae en
# `/user.slice/user-1000.slice/user@1000.service/app.slice/app-com.anthropic.Claude-<pid>.scope`,
# o sea DENTRO. Eso incluye el `python -m pytest` directo, que es exactamente
# la via que el contador advisory no cubria y que tiro la maquina.
#
# QUIEN MAS CAE DENTRO, y es el precio: `atlas-api.service` vive tambien bajo
# app.slice y usa GPU (medido: pid con memoria de computo en
# `.../app.slice/atlas-api.service`). Si el abanico de un agente empuja el
# slice hasta el techo, el kernel puede elegirlo a el como victima. Se declara
# en vez de descubrirse el dia que pase.
#
# QUE QUEDA FUERA, declarado: todo lo de `system.slice`, incluidos los
# contenedores (medido: un proceso con GPU en
# `/system.slice/docker-<id>`). Una carga con GPU dentro de Docker NO esta
# cubierta por este techo. Si esa via se usa para trabajo pesado, necesita su
# propio limite y este fichero no se lo da.
[Slice]
MemoryMax=48G
MemorySwapMax=4G
