# blackbox: PROTECCION del camino interactivo frente al reclamo de memoria.
# Parte de la cadena que instala `enable-privileged.sh` seccion 13. Ver el
# fichero de `user.slice` para el porque completo y la medicion.
#
# RECORDATORIO: en cgroup v2 la proteccion efectiva de un hijo esta acotada por
# la del padre, asi que esta cadena vale lo que valga su eslabon mas debil. Un
# 0 en cualquier nivel anula los de abajo. `bb status` lo comprueba entero.
#
# NIVEL 5 de 7: app.slice no se protege a SI MISMO -- se protege para poder
# PASAR la proteccion a los scopes de ventana que cuelgan de el. La distribucion
# en cgroup v2 va a los hijos que la PIDEN: aqui la piden los scopes de
# aplicacion de escritorio, y NO la piden los scopes de arnes. Ese es el
# mecanismo entero.
#
# Medido el 2026-09-25 dentro de este slice:
#   app-com.anthropic.Claude-<pid>.scope        19.74 GB actual, 22.70 GB pico   <- ARNES
#   app-gnome-com.anthropic.Claude-<pid>.scope   1.04 GB actual,  1.29 GB pico   <- VENTANA
#
# 4G cubre las ventanas con margen y deja los ~23 GB del arnes enteramente
# reclamables, que es exactamente el reparto que se quiere.
[Slice]
MemoryLow=4G
