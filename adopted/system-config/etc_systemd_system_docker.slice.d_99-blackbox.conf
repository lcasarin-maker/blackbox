# /etc/systemd/system/docker.slice.d/99-blackbox.conf
#
# Techo agregado para TODOS los contenedores de Docker.
#
# POR QUE AQUI Y NO EN docker.service: medido el 2026-09-24, los contenedores
# cuelgan de `system.slice/docker-<id>.scope` -- son cgroups HERMANOS del
# demonio, no hijos. Un drop-in sobre `docker.service` no los toca. Con
# `"cgroup-parent": "docker.slice"` en /etc/docker/daemon.json pasan a colgar de
# esta slice, y este fichero los acota a todos, tambien a los que se creen
# manana sin que nadie se acuerde de ponerles `--memory`.
#
# DE DONDE SALEN LOS 16G, y por que ya no son 32.
#
# El numero anterior (32G) se puso el 2026-09-24 como "casi 3x el pico" y venia
# con una holgura declarada que resulto FALSA: decia "dejando 41 GiB para el
# kernel, el resto de system.slice y la memoria unificada de GPU". Con la serie
# medida el 2026-09-25 sobre 18 944 muestras de bb, la memoria unificada sola
# tiene **mediana 49.0 GiB, p90 50.1 y maximo 85.4**. Nunca cupo en esos 41.
#
# El pico agregado de los contenedores sigue siendo pequeno: 11.2 GiB.
# 16G es 1.4x ese pico, y el recorte de 32 a 16 no tiene coste observado --
# ningun contenedor se ha acercado nunca a 16.
#
# LO QUE COMPRA EL RECORTE, que no es margen sino un instrumento utilizable.
# El presupuesto deja para la GPU lo que no reclaman los techos:
#
#   con docker.slice=32G  ->  121.1 - 48 - 32 - 4 = 37.1 GiB
#   con docker.slice=16G  ->  121.1 - 48 - 16 - 4 = 53.1 GiB
#
# Contrastado contra las 18 944 muestras:
#
#   por encima de 37 GiB  ->  el 75.4 % del tiempo   (una alarma ahi es ruido)
#   por encima de 53 GiB  ->  el  0.9 % del tiempo   (una alarma ahi es senal)
#
# El corte de 53.1 NO se eligio: sale de restar los techos al MemTotal. Que
# caiga justo por encima del p90 del estado estacionario (50.1) es lo que
# valida el reparto -- el presupuesto y la conducta observada coinciden.
#
# Sin este recorte la alarma del abanico de GPU no se puede armar, porque su
# umbral caeria dentro de la operacion normal.
#
# LIMITE DECLARADO -- lo mismo que el techo de app.slice: un cgroup NO contabiliza
# la memoria unificada de GPU. Medido el 2026-09-24: 7 GiB de CUDA se cobraron
# como 15 MiB (0.2%). `nemotron-server` es vLLM; sus pesos viven en memoria
# unificada y NO estan en los 9.9 GiB que el cgroup le cobra. Este techo acota
# su memoria ordinaria. La otra mitad la cubren `bb-usable` (PSI) y
# `uvm_global_oversubscription=0`, no este fichero.
#
# Los 16G SI salen de una serie: 18 944 muestras. Lo que sigue sin cuadrar es la
# SUMA -- 48 + 16 + 4 + 86 de GPU = 154 sobre 121.1 -- porque el abanico de
# procesos de GPU no tiene techo y no se lanza desde este repo. Ver
# DEBT-TECHOS-SIN-CALIBRAR.
#
# Revertir:  sudo ./enable-privileged.sh --revert
[Slice]
MemoryMax=16G
MemorySwapMax=4G
