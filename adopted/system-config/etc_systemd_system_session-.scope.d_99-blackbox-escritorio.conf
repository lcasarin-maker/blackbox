# blackbox: PROTECCION del camino interactivo frente al reclamo de memoria.
#
# POR QUE, con la medicion delante. El 2026-09-25 el dueno reinicio la maquina
# porque "casi no se podia escribir". Todos los totales leian sanos: load1 0.95
# sobre 20 nucleos, 65.8 GB disponibles, PSI en cero. Lo que si se movio en una
# sola direccion esa noche fue el swap: de 16383 MiB libres a las 20:51 a 12067
# a las 03:28 -- 4.3 GB expulsados y nunca recuperados, con el 53 % de la RAM
# libre. Cada pagina que una aplicacion interactiva vuelve a tocar despues de
# eso es una lectura de disco.
#
# POR QUE NO ES UN PROBLEMA DE CPU, descartado con experimento y no con un
# argumento: se corrio una rampa de carga midiendo el ida y vuelta al servidor
# X. Con 40 quemadores sobre 20 nucleos (cpu_some 27.84) la mediana paso de
# 4 ms a 8 ms y el peor caso a 13 ms. Eso no impide teclear. Dar prioridad de
# CPU al escritorio habria sido la respuesta obvia y habria sido inutil.
#
# QUE HACE memory.low, y que NO hace. Es una PROTECCION, no un techo: reserva
# memoria frente al reclamo, no limita cuanta se puede pedir. Lo que no se usa
# no se desperdicia -- queda disponible para los demas. Sin esto, la ventana en
# la que escribes y el arnes que se come la memoria son hermanos sin ninguna
# prioridad relativa: cuando hay que expulsar paginas, las tuyas valen lo mismo
# que las suyas. Medido antes de poner esto: memory.low = 0 y memory.min = 0 en
# user.slice, en app.slice y en session.slice. Nada estaba protegido.
#
# POR QUE LA CADENA ENTERA. En cgroup v2 la proteccion efectiva de un hijo esta
# acotada por la del padre: con el padre en 0, lo que declare el hijo no sirve
# para el reclamo global. Por eso hay un fichero por nivel.
#
# NIVEL 3a de 4: AQUI VIVE Xorg, y este fue el detalle que cambio el diseno.
# Medido leyendo /proc/<pid>/cgroup el 2026-09-25: Xorg NO esta en
# session.slice como parecia, sino en
# /user.slice/user-1000.slice/session-<N>.scope, hermano de user@1000.service.
# Proteger solo session.slice habria dejado fuera al servidor X -- justo lo que
# mide `latencia_x` -- y se habria leido como proteccion sin serlo.
#
# EL NUMERO: memory.peak de session-3.scope = 0.05 GB (Xorg, gdm-x-session,
# gnome-session-binary). 2G es 40x lo observado. Es holgado a proposito: una
# proteccion que no se usa no cuesta nada, y quedarse corto la vuelve adorno.
# El nombre lleva el numero de sesion, que cambia en cada login, asi que se usa
# la forma con guion final que systemd aplica a todo `session-<N>.scope`.
[Scope]
MemoryLow=2G
