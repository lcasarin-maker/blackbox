# /etc/sysctl.d/99-blackbox-panic.conf
#
# La red de seguridad de la red de seguridad: si kdump no consigue arrancar el
# kernel de captura, que el panic reinicie igualmente en vez de quedarse parado.
#
# DE DONDE SALE. /etc/sysctl.d/99-freeze-panic.conf (2026-09-09, NO es de este
# repo: viene del hilo del foro de NVIDIA #358951 "Spark hangs, requires a hard
# reset", cosechado en Atlas) obliga al kernel a entrar en panic ante un
# hung_task de 120 s, un softlockup o un hardlockup. Su proposito alli era
# DIAGNOSTICO -- panic + kdump para capturar el cuelgue -- no recuperacion.
#
# Y en esta maquina kdump SI esta armado, medido el 2026-09-24:
#   kdump-config status      -> ready to kdump
#   /sys/kernel/kexec_crash_loaded -> 1
#   /proc/cmdline            -> crashkernel=1G-:512M
# asi que un panic hace kexec y la maquina reinicia. `kernel.panic = 0` NO la
# deja colgada mientras kdump funcione. Esa afirmacion, dicha antes de medir,
# era falsa y queda corregida aqui.
#
# Lo que este fichero cubre es el caso en que kdump FALLA. Si __crash_kexec()
# no consigue arrancar el kernel de captura, panic() sigue por el camino normal
# y honra `panic_timeout`, que es exactamente `kernel.panic`. Con 0, ahi si se
# queda parada para siempre. Con 10, reinicia diez segundos despues.
#
# Ordenacion: "99-blackbox-panic" ordena ANTES que "99-freeze-panic", y no hay
# conflicto porque aquel no declara kernel.panic. Si algun dia lo declarara,
# ganaria el suyo -- y habria que mover esto a un prefijo mayor.
#
# LIMITE DECLARADO: no cubre el caso en que el kernel se atasca SIN entrar en
# panic -- el livelock de memoria, que es lo que paso en los cuatro
# congelamientos. Ese lo cubren bb-usable por PSI y, por debajo, el watchdog de
# hardware SBSA que systemd alimenta con timeout de 1 min. Verificado en el
# arranque actual:
#   systemd[1]: Using hardware watchdog 'SBSA Generic Watchdog' ... /dev/watchdog0
#   systemd[1]: Watchdog running with a timeout of 1min.
# (el `timeleft` de ese driver NO sirve de instrumento: reporta ~40 anos.)
#
# Revertir:  sudo ./enable-privileged.sh --revert
kernel.panic = 10
