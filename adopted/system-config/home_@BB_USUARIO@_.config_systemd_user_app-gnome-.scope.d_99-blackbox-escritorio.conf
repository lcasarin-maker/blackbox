# blackbox: PROTECCION del camino interactivo frente al reclamo de memoria.
# Parte de la cadena que instala `enable-privileged.sh` seccion 13. Ver el
# fichero de `user.slice` para el porque completo y la medicion.
#
# RECORDATORIO: en cgroup v2 la proteccion efectiva de un hijo esta acotada por
# la del padre, asi que esta cadena vale lo que valga su eslabon mas debil. Un
# 0 en cualquier nivel anula los de abajo. `bb status` lo comprueba entero.
#
# NIVEL 6 de 7: LAS VENTANAS. Aqui vive la aplicacion en la que se escribe.
#
# ESTE FICHERO EXISTE PORQUE UNA AFIRMACION MIA ERA FALSA. La ficha
# DEBT-ESCRITORIO-Y-ARNESES-COMPARTEN-CGROUP decia que el scope de una app
# "lleva el pid en el nombre, asi que no admite un drop-in estable". No es
# cierto: systemd resuelve los drop-ins tambien por prefijo truncado en cada
# guion, igual que `user-.slice.d` que esta cadena ya usaba. Comprobado sobre
# la unit viva el 2026-09-25:
#
#   $ systemctl --user show app-gnome-com.anthropic.Claude-38380.scope -p MemoryLow
#   MemoryLow=3221225472
#   $ cat .../app-gnome-com.anthropic.Claude-38380.scope/memory.low
#   3221225472
#   $ cat .../app-com.anthropic.Claude-38380.scope/memory.low      # el ARNES
#   0
#
# El arnes queda en 0 sin tener que nombrarlo: no pide proteccion, y por eso no
# la recibe. Discrimina por COMO se lanzo -- `app-gnome-` es lo que arranca el
# escritorio-- y no por un nombre de producto.
#
# EL NUMERO: pico de la mayor de estas ventanas, 1.29 GB. 2G da 1.5x.
#
# LO QUE NO CUBRE: una aplicacion empaquetada como snap NO nace con este
# prefijo -- nace como `snap.<paquete>.<app>-<uuid>.scope`. Tiene su propio
# fichero al lado.
[Scope]
MemoryLow=2G
