# blackbox: mitigación parcial para NVIDIA/open-gpu-kernel-modules#1358.
# Limita la oversubscription global de UVM; algunos OOM resultan recuperables,
# pero hashcat todavía produjo OOM recuperable y el prefill siguió colgándose
# con este parámetro en 0. No garantiza que el host sobreviva.
options nvidia_uvm uvm_global_oversubscription=0
