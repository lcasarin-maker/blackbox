# blackbox: PROTECCION del camino interactivo frente al reclamo de memoria.
# Parte de la cadena que instala `enable-privileged.sh` seccion 13. Ver el
# fichero de `user.slice` para el porque completo y la medicion.
#
# RECORDATORIO: en cgroup v2 la proteccion efectiva de un hijo esta acotada por
# la del padre, asi que esta cadena vale lo que valga su eslabon mas debil. Un
# 0 en cualquier nivel anula los de abajo. `bb status` lo comprueba entero.
#
# NIVEL 7 de 7: antigravity, que es un snap y por eso NO cae bajo
# `app-gnome-.scope`. Se le da su propio fichero porque es el editor que estaba
# abierto en el episodio del 2026-09-25 -- consumio 2 h 37 min 14 s de CPU en
# 2 h 14 min 58 s de reloj, 116.5 % de un nucleo sostenido.
#
# LIMITE DECLARADO, y es importante: el nombre del scope
# (`snap.antigravity.antigravity-<uuid>.scope`) esta tomado del journal de ese
# dia, no de una unit viva -- antigravity no estaba corriendo cuando se escribio
# esto, asi que el prefijo esta DERIVADO, no verificado sobre el sujeto. El
# mecanismo si esta verificado, sobre el scope de la ventana de Claude.
#
# Verificalo la proxima vez que abras antigravity, y no te fies de este
# comentario:
#   systemctl --user list-units --type=scope | grep antigravity
#   systemctl --user show <ese scope> -p MemoryLow -p DropInPaths
#   espera MemoryLow=2147483648 y este fichero en DropInPaths.
# Si sale 0, el prefijo no es el que se supuso y hay que corregirlo aqui.
#
# SEGUNDO LIMITE: el scope cubre el editor ENTERO, incluidos los pytest-xdist
# que lanza dentro -- se vieron en las muestras de bb el 2026-09-25 a las 03:03,
# 03:10 y 03:11. Proteger la ventana protege tambien a sus trabajadores. 2G es
# una fraccion pequena de lo que llega a usar, asi que lo protegido es un
# conjunto de trabajo, no la aplicacion entera.
[Scope]
MemoryLow=2G
