kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 120
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
# El detector de bloqueo duro NUNCA estuvo activo en esta maquina: el kernel (6.17 y 7.0) registra
# "watchdog: NMI not fully supported / Hard watchdog permanently disabled". El 7.0 ademas rechaza
# esta escritura con error 524 y dejaba systemd-sysctl en failed; el '-' hace que el fallo no cuente.
-kernel.nmi_watchdog = 1
