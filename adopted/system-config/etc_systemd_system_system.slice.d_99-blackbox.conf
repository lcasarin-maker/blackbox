# /etc/systemd/system/system.slice.d/99-blackbox.conf
#
# Techo agregado para los servicios del sistema.
#
# POR QUE EXISTE, y por que no existia antes. `tools/presupuesto_memoria.py`
# separa COMPROMISOS (lo que el kernel aplica) de observaciones, y hasta hoy
# `system.slice` entraba en la suma por lo que USABA, no por lo que prometia.
# Eso hace la cuenta irreal en las dos direcciones: un dia usa 1.3 GiB y parece
# que sobra memoria, otro usa 7.7 y parece que falta, sin que nada haya cambiado
# de compromiso. Un reparto que se mueve con la carga no es un reparto.
#
# DE DONDE SALEN LOS 12G. Serie de 3489 muestras de `bb sample`, campo `slices`:
#
#   system   p50 3.6   p95 9.6   p99 9.8   max 9.8   (peak_kb historico 10.8)
#
# 12 deja 1.2 GiB sobre el pico historico. No es generoso y no pretende serlo:
# los tres techos salen de dividir 71.0 GiB -- lo que queda tras el suelo de GPU
# de 50.1 -- entre tres slices cuyos picos suman 63.3. El margen que hay es el
# que cabe.
#
# LO QUE NO CUBRE, declarado. Un cgroup NO contabiliza la memoria unificada de
# GPU: medido el 2026-09-24, 7 GiB de CUDA se cobraron como 15 MiB (0.2 %). Si
# un servicio de system.slice usara GPU, este techo no lo veria. Contra ese
# fallo actuan `bb-usable` sobre PSI y `uvm_global_oversubscription=0`, no este
# fichero. Es el mismo limite que declaran los techos de app.slice y
# docker.slice, y se repite aqui para que nadie lo suponga cubierto.
#
# RIESGO ACEPTADO. `system.slice` contiene servicios que no son de este repo
# -- el demonio de Docker, rustdesk, postgres, los del sistema operativo. Un
# techo aqui puede matar uno de ellos si el conjunto pasa de 12 GiB, y el pico
# medido (10.8) deja 1.2 de aire. Se acepta porque la alternativa medida es
# peor: sin techo, los compromisos sumaban 121.8 sobre 121.1 disponibles, o sea
# que la promesa no se podia cumplir y quien elegia la victima era el kernel.
#
# Revertir:  sudo ./enable-privileged.sh --revert
[Slice]
MemoryMax=12G
