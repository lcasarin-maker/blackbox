# /etc/systemd/system.conf.d/99-blackbox-watchdog.conf
#
# El watchdog de HARDWARE, la capa de mas abajo: si el kernel se atasca tanto
# que ni systemd responde, el SBSA Generic Watchdog reinicia la maquina solo.
#
# POR QUE UN DROP-IN Y NO system.conf. Medido el 2026-09-24: la linea viva esta
# en /etc/systemd/system.conf:34 (RuntimeWatchdogSec=60), editada a mano. Ese
# fichero lo REESCRIBE el paquete systemd en cada actualizacion, asi que la
# proteccion desapareceria en silencio y nadie se enteraria hasta el siguiente
# cuelgue. Un drop-in sobrevive a la actualizacion. Si algun dia system.conf
# vuelve a su valor de fabrica, este fichero mantiene el numero.
#
# Verificado en el arranque del 2026-09-24:
#   systemd[1]: Using hardware watchdog 'SBSA Generic Watchdog', version 0, device /dev/watchdog0
#   systemd[1]: Watchdog running with a timeout of 1min.
#
# LIMITE DECLARADO: /sys/class/watchdog/watchdog0/timeleft NO sirve de
# instrumento en esta maquina -- reporta ~40 anos, o sea no discrimina entre
# alimentado y no alimentado. Lo unico que prueba que esta armado es el journal
# de arriba.
[Manager]
RuntimeWatchdogSec=60
