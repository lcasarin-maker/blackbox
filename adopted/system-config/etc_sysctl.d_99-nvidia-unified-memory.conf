# /etc/sysctl.d/99-nvidia-unified-memory.conf
# Afinación de memoria del kernel para AI TOP ATOM / NVIDIA GB10 (Grace Hopper Unified Memory)
# Documentado en knowledge/hardware/ai_top_atom_unified_memory_oom_mitigation.md

# 1. Garantiza 1 GB de memoria física atómica de emergencia para el kernel y drivers
# Evita hard lockups cuando vLLM/CUDA asigna ráfagas de tensores en memoria unificada
vm.min_free_kbytes = 1048576

# 2. Desalojo más agresivo de Page Cache (default 100 -> 150)
# En Grace Hopper el Page Cache de Linux fragmenta el espacio contiguo que necesita la GPU
vm.vfs_cache_pressure = 150

# 3. Reduce el umbral de swappiness (default 60 -> 15)
# Evita saturar el bus LPDDR5X con paginación innecesaria durante ráfagas de inferencia
vm.swappiness = 15
