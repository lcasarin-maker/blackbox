# Etapa sesion-<uid>: bb-etapa@sesion-<uid> corre cuando el gestor de usuario de ese uid queda listo (user@ es
# Type=notify: listo = su default.target alcanzado). Va por uid y no una sola "sesion-usuario" porque GDM levanta su
# propio user@ para el saludo (uid de sistema) antes de que nadie entre; tools/etapas_arranque.py separa los dos.
[Unit]
Wants=bb-etapa@sesion-%i.service
Before=bb-etapa@sesion-%i.service
