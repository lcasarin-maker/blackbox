# Etapa gpu-lista: solo se anota si `timeout 10 nvidia-smi -L` lista una GPU. Si no, la instancia falla y se reintenta
# cada 10 s; StartLimit corta a los 20 intentos (~7 min). Nunca bloquea a nadie: nada la ordena antes de si.
[Unit]
After=systemd-modules-load.service
StartLimitIntervalSec=900
StartLimitBurst=20

[Service]
ExecStartPre=/bin/sh -c 'timeout 10 nvidia-smi -L | grep -q "^GPU "'
Restart=on-failure
RestartSec=10
