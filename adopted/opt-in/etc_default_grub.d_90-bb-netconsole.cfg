# /etc/default/grub.d/90-bb-netconsole.cfg -- capa netconsole-arranque (blackbox adopted/opt-in).
# La escribe `tools/opt_in_captura.sh aplica netconsole-arranque` con los parametros de /etc/blackbox/netconsole.conf;
# el retroceso es `... retrocede netconsole-arranque`, nunca editar este fichero a mano.
# Va en _DEFAULT, no en GRUB_CMDLINE_LINUX: las entradas "recovery mode" quedan sin el y sirven de salida.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT @NETCONSOLE@"
