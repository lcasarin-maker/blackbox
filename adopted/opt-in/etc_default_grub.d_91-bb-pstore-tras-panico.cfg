# /etc/default/grub.d/91-bb-pstore-tras-panico.cfg -- capa pstore-tras-panico (blackbox adopted/opt-in).
# crash_kexec_post_notifiers: ante un panico el kernel corre los notificadores y el volcado de kmsg a pstore ANTES
# de saltar al kernel de kdump, asi que pstore guarda el panico aunque kdump este cargado.
# Costo: ese codigo corre en un kernel ya roto y puede colgarse antes del kexec; kdump queda algo menos fiable.
# Retroceso: `tools/opt_in_captura.sh retrocede pstore-tras-panico`.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT crash_kexec_post_notifiers"
