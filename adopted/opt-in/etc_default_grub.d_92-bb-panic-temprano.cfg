# /etc/default/grub.d/92-bb-panic-temprano.cfg -- capa panic-temprano (blackbox adopted/opt-in).
# kernel.panic vale 0 hasta que corre sysctl (99-blackbox-panic.conf lo pone en 10): un panico antes de eso, si
# kdump no lo recoge, deja la maquina parada. panic=30 reinicia a los 30 s desde el primer instante del arranque.
# Retroceso: `tools/opt_in_captura.sh retrocede panic-temprano`.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT panic=30"
