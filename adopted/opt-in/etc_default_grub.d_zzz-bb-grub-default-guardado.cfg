# /etc/default/grub.d/zzz-bb-grub-default-guardado.cfg -- capa grub-default-guardado (blackbox adopted/opt-in).
# grub-mkconfig lee /etc/default/grub y DESPUES /etc/default/grub.d/*.cfg en orden de glob: `zzz-` carga la ultima
# (despues de los nombres con numero y de zz-timeout-10.cfg) y su GRUB_DEFAULT gana sobre el literal del principal.
# Con saved, GRUB arranca `saved_entry` del grubenv: la capa lo inicializa con la entrada que arrancaba hasta hoy,
# y despues lo fijan `sudo panic` (grub-set-default al punto de restauracion) o Luis con grub-set-default.
# GRUB_SAVEDEFAULT=false: elegir otra entrada a mano en el menu NO cambia el arranque por defecto.
# Retroceso: `tools/opt_in_captura.sh retrocede grub-default-guardado`, nunca editar este fichero a mano.
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=false
