# Version del producto. La lee `tools/` y la etiqueta de cada release; ya no hay un reloj de caducidad de exenciones.
[project]
name = "blackbox"
version = "4.6.1"

# Ruff protege de errores reales: sintaxis/ejecucion (E9), nombre indefinido (F821), comparacion de identidad con un
# literal (F632) y funcion redefinida (F811). Los limites de complejidad y de argumentos (C901, PLR09xx) los exigia el
# juez del kit anterior como estilo, no protegen de un fallo del producto, y se retiraron el 2026-10-17 (DECISIONS.md).
[tool.ruff.lint]
select = ["E9", "F821", "F632", "F811"]
