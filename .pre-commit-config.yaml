fail_fast: false
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        stages:
          - pre-commit
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args:
          - --no-banner
          - --redact
        stages:
          - pre-commit
  - repo: local
    hooks:
      - id: ruff-full
        name: Ruff whole tree
        entry: ruff check .
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: git-history-present
        name: Git history enumerated
        entry: sh -c 'count=$(git rev-list --all --count) && test "$count" -gt 0'
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: gitleaks-history
        name: Gitleaks history
        entry: gitleaks git --no-banner --redact --log-opts=--all .
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Product behavior
        entry: python -m pytest -q
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: bash-sintaxis
        name: sintaxis de los scripts bash
        entry: bash -n
        language: system
        files: ^(bin/bb|.*\.sh)$
      - id: bb-cobertura-piso
        name: cobertura de bin/bb no baja del piso
        entry: tools/piso_cobertura.sh
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
      - id: inventario-spec
        name: SPEC.md inventaria lo que el repo ejecuta y posee
        entry: python3 -m tools.inventario --check
        language: system
        pass_filenames: false
        always_run: true
      - id: migration-parity
        name: 'Migration parity pending: integrity, PII and product hooks'
        entry: "sh -c 'echo COULD_NOT_RUN: restore integrity, PII, product hooks and old launcher references before delivery >&2; exit 2'"
        language: system
        stages:
          - pre-push
        pass_filenames: false
        always_run: true
