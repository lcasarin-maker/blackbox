# blackbox: tope de CREACION para cada scope de la app Claude (FEATURE-PORTERO-UNIVERSAL-DE-LA-MAQUINA-01).
#
# Va en ~/.config/systemd/user/app-com.anthropic.Claude-.scope.d/. systemd aplica un drop-in por PREFIJO a
# `app-com.anthropic.Claude-<pid>.scope` en el momento de crearlo. Medido 2026-10-12 con un scope desechable
# (tasks/evidence/FEATURE-PORTERO-UNIVERSAL-DE-LA-MAQUINA-01/validaciones.md §2): positivo con el prefijo,
# negativo (`memory.max=max`) sin el. tests/test_portero.py repite esa medicion con ESTE fichero.
#
# Complementa al portero, no lo sustituye: el portero saca cada suite a su propio scope con 20G; esto acota lo que
# queda (las sesiones y lo que el portero aun no detecto).
#
# MemoryMax=35G: calibracion de DEBT-COLAPSOS-11-OCT-SUITES-PYTEST-SIN-TECHO-01 sobre 489 muestras con scope y
# PSI: con el scope Claude por debajo de 35 GB, 0 de 439 tuvieron PSI full >= 10 (maximo 7.17); entre 35 y 40,
# 2 de 2 (maximo 64.7). Muestra pequena en el tramo alto, declarado alli. Precio: al tocarlo el kernel mata DENTRO
# del scope, y puede ser un proceso de la propia app.
# TasksMax=1230: `pids.peak` de app.slice en el arranque del 2026-10-11 22:56 (medido 2026-10-12); el scope no
# puede tener mas tareas que el slice entero tuvo.
# Swap: no se fija aqui; manda el MemorySwapMax=4G de app.slice.
# Solo afecta a scopes NUEVOS; el vivo necesita `systemctl --user set-property --runtime <scope> ...`.
[Scope]
MemoryMax=35G
TasksMax=1230
