[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: Fast unit tests (<= 0.2s)
    integration: Integration tests (<= 2.0s)
    slow: Slow tests (> 2.0s)
    e2e: End-to-end and browser tests
    sleeps_aceptados: los tres tests con los cuatro time.sleep de DEBT-ACCEPTED-SLEEP-TESTS-BB
        (el close_check de esa ficha selecciona por aqui: la suite entera dejo de caber
         en el presupuesto de 53s de backlog-verifier al crecer de 24s a mas de 85s)
addopts = -m "not slow and not e2e" --tb=short
